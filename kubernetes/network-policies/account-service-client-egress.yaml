apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: account-service-client-egress
  namespace: finserv-accounts
spec:
  podSelector:
    matchLabels:
      access-account-service: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: account-service
      ports:
        - protocol: TCP
          port: 8000
